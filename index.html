<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My E-Commerce Store</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
    }

    .product h3 {
      margin-top: 0;
    }

    .price {
      color: green;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #0056b3;
    }

    .cart {
      background: white;
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 250px;
    }

    .remove {
      background: red;
    }
  </style>
</head>

<body>

<header>
  <h1>My E-Commerce Store</h1>
  <p>Simple Online Shopping Website</p>
</header>

<div class="container">

  <h2>Products</h2>

  <div id="products" class="products">
    Loading products...
  </div>

  <div class="cart">

    <h2>Shopping Cart</h2>

    <div id="cart">
      Your cart is empty.
    </div>

    <h3>
      Total: ₹<span id="total">0</span>
    </h3>

    <h3>Customer Details</h3>

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    >

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >

    <br>

    <button onclick="placeOrder()">
      Place Order
    </button>

  </div>

</div>

<script>

let products = [];
let cart = [];

// Load products from server
fetch("/api/products")
  .then(response => response.json())
  .then(data => {
    products = data;
    displayProducts();
  });

// Display products
function displayProducts() {

  const container = document.getElementById("products");

  container.innerHTML = "";

  products.forEach(product => {

    container.innerHTML += `
      <div class="product">

        <h3>${product.name}</h3>

        <p>${product.description}</p>

        <p class="price">
          ₹${product.price}
        </p>

        <button onclick="addToCart(${product.id})">
          Add to Cart
        </button>

        <button onclick="viewProduct(${product.id})">
          Details
        </button>

      </div>
    `;
  });
}

// Add product to cart
function addToCart(id) {

  const product = products.find(p => p.id === id);

  cart.push(product);

  displayCart();
}

// Display shopping cart
function displayCart() {

  const cartDiv = document.getElementById("cart");

  if (cart.length === 0) {
    cartDiv.innerHTML = "Your cart is empty.";
    document.getElementById("total").innerText = "0";
    return;
  }

  cartDiv.innerHTML = "";

  let total = 0;

  cart.forEach((product, index) => {

    total += product.price;

    cartDiv.innerHTML += `
      <p>
        ${product.name}
        - ₹${product.price}

        <button
          class="remove"
          onclick="removeFromCart(${index})">
          Remove
        </button>
      </p>
    `;
  });

  document.getElementById("total").innerText = total;
}

// Remove item
function removeFromCart(index) {

  cart.splice(index, 1);

  displayCart();
}

// Product details
function viewProduct(id) {

  const product = products.find(p => p.id === id);

  alert(
    product.name +
    "\n\n" +
    product.description +
    "\n\nPrice: ₹" +
    product.price
  );
}

// Place order
function placeOrder() {

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  if (cart.length === 0) {
    alert("Please add products to your cart.");
    return;
  }

  if (!name || !email) {
    alert("Please enter your name and email.");
    return;
  }

  fetch("/api/order", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      customer: {
        name: name,
        email: email
      },
      items: cart
    })

  })
  .then(response => response.json())
  .then(data => {

    alert(data.message);

    cart = [];

    displayCart();

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
  });
}

</script>

</body>
</html>
